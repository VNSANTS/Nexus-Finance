name: Android Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This manual workflow exists on main and can therefore be dispatched from
      # the draft PR branch. Never sign unrelated source code by accident.
      - name: Require private-beta branch
        run: |
          test "$GITHUB_REF_NAME" = "nexus/android-private-beta-2026-11-18" || {
            echo "::error::Select nexus/android-private-beta-2026-11-18 in 'Use workflow from'."; exit 1;
          }

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Configure ANDROID_KEYSTORE_BASE64 in GitHub Actions secrets." && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Configure ANDROID_KEYSTORE_PASSWORD in GitHub Actions secrets." && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Configure ANDROID_KEY_ALIAS in GitHub Actions secrets." && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Configure ANDROID_KEY_PASSWORD in GitHub Actions secrets." && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          node scripts/verificar-beta-android.mjs

      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://ygtroklufolvixwazkne.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uRP9xxjMeC_-L6A8AWwj8g_Seonofnf
        run: |
          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-release.keystore"
          chmod 600 "$RUNNER_TEMP/nexus-release.keystore"
          test -s "$RUNNER_TEMP/nexus-release.keystore"

      - name: Validate signing certificate and alias
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/nexus-release.keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS"

      - name: Build signed release APK and bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nexus-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          (cd app/build/outputs/apk/release && sha256sum app-release.apk > app-release.apk.sha256)

      - name: Upload signed beta APK, checksum and AAB for owner review
        uses: actions/upload-artifact@v4
        with:
          name: nexus-finance-beta-signed-review
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nexus-release.keystore"
